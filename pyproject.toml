[project]
name = "llm-reputation"
version = "0.1.0"
description = "Experimental code for LLM-driven evolution of reputation algorithms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "openai>=2.35.1",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "sentence-transformers==5.7.0",
    "torch==2.11.0",
    # SFR-Embedding-Code-400M_R was published against this Transformers release.
    "transformers==4.45.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[project.scripts]
# Core experiment entry points.
llm-reputation = "experiments.main:main"
rerun-experiments = "experiments.tools.rerun:main"

# Agent 2 bidirectional invasion experiment and its dashboard.
run-agent2-invasion = "experiments.analysis.invasion.run_agent2_schmid_invasion:main"
plot-agent2-invasion = "experiments.analysis.plot_agent2_schmid_invasion:main"
plot-evolution-curves = "experiments.analysis.plot_evolution_curves:main"

# General analysis and lineage visualizations.
make-figures = "experiments.analysis.make_figures:main"
plot-lineage = "experiments.analysis.plot_lineage:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["experiments*"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
